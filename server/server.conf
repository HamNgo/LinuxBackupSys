# Server-side configuration (Computer A)
# Installed to /etc/linux-backup/server.conf by setup_server.sh
# This file is sourced by Bash: no spaces around "=".

# Dedicated, unprivileged account that receives backups over SSH
BACKUP_USER="backupuser"

# Root of all backup storage. Layout: $STORAGE_ROOT/<client>/<snapshot>/
STORAGE_ROOT="/srv/backups"

# Where server-side scripts write logs
LOG_DIR="/var/log/linux-backup"

# Snapshot naming (local time; keep both computers' clocks and timezones in sync)
SNAPSHOT_FORMAT="%Y-%m-%d_%H-%M-%S"

# Retention (used by cleanup.sh from Day 6)
RETENTION_DAYS=7
# Never delete the newest N snapshots, even if they are expired
MIN_SNAPSHOTS_KEEP=2
